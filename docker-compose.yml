version: '3.8'

services:
  indus-flow-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indus-agent-app
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./src:/app/src
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
